[project]
name = "agent-rooms"
version = "0.1.0"
description = "Streamlit simulation where AI characters live in customizable rooms and talk to you, with voice"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "garunya" }]
keywords = ["ai", "agents", "simulation", "streamlit", "ag2", "grok", "xai", "voice", "roleplay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "ag2[openai]>=1.1.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Pyflakes and pycodestyle errors only. The codebase is dense on purpose;
# style rules would churn it without catching real bugs.
select = ["E9", "F"]
